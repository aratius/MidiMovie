<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>MidiMovie Pro — Thank you</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 16px;background:#111;color:#eee}a.b{display:inline-block;background:#6c5ce7;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;margin:12px 0}code{display:block;word-break:break-all;background:#222;padding:10px;border-radius:6px;font-size:12px}</style></head>
<body><h1>ありがとうございます / Thank you</h1><p id="m">キーを発行しています… / Issuing your key…</p><div id="o"></div>
<script src="license-config.js"></script>
<script>
(async()=>{
  const m=document.getElementById('m'),o=document.getElementById('o');
  const api=(window.MM_LICENSE&&MM_LICENSE.keyApi)||'';
  const sid=new URLSearchParams(location.search).get('session_id');
  try{
    if(!api||!sid) throw 0;
    const r=await fetch(api.replace(/\/$/,'')+'/key?session_id='+encodeURIComponent(sid)); const j=await r.json(); if(!j.ok) throw 0;
    m.textContent='Pro のキーです。メールにも届きます(届かない場合はこのページを保存してください)/ Your Pro key (also emailed):';
    const a=document.createElement('a');a.className='b';a.href='editor.html#gift='+j.key;a.textContent='Pro を有効にして開く / Unlock Pro';
    const c=document.createElement('code');c.textContent=j.key; o.append(a,c);
  }catch(e){ m.textContent='キーを取得できませんでした。決済確認メールの案内、または support までご連絡ください。/ Could not fetch your key — please contact support with your receipt.'; }
})();
</script></body></html>
