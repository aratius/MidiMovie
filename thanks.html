<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>MidiMovie Pro — Thank you</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 16px;background:#111;color:#eee}a.b{display:inline-block;background:#6c5ce7;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;margin:12px 0}code{display:block;word-break:break-all;background:#222;padding:10px;border-radius:6px;font-size:12px}</style></head>
<body><h1 id="h"></h1><p id="m"></p><div id="o"></div>
<p style="font-size:13px;opacity:.7"><a href="terms.html" style="color:#a29bfe" id="lt"></a> · <a href="tokushoho.html" style="color:#a29bfe" id="ls"></a></p>
<script src="license-config.js"></script>
<script src="analytics.js"></script>
<script>
(function(){
  var D={ja:{h:'ありがとうございます',w:'キーを発行しています…',ok:'Pro のキーです。このページを閉じると見られなくなります。必ずコピーして保管してください(別の端末では、このキーを Pro ダイアログに貼ります):',copy:'キーをコピー',copied:'コピーしました ✓',btn:'Pro を有効にして開く',ng:'キーを取得できませんでした。購入の確認メールを添えて、利用規約に記載の連絡先までご連絡ください。',t:'利用規約',s:'特定商取引法に基づく表記'},
         en:{h:'Thank you',w:'Issuing your key…',ok:'Your Pro key. You will not be able to see it again after leaving this page, so please copy and keep it (on another device, paste it into the Pro dialog):',copy:'Copy key',copied:'Copied ✓',btn:'Unlock Pro',ng:'Could not fetch your key. Please contact us (see the terms) with your purchase receipt.',t:'Terms',s:'Legal notice'},
         zh:{h:'谢谢您',w:'正在发放密钥…',ok:'您的 Pro 密钥。离开此页面后将无法再次查看,请务必复制并妥善保存(在其他设备上,请将密钥粘贴到 Pro 对话框):',copy:'复制密钥',copied:'已复制 ✓',btn:'启用 Pro 并打开',ng:'无法获取密钥。请携带购买凭证,通过使用条款中的联系方式与我们联系。',t:'使用条款',s:'特定商业交易法标示'}};
  var l='en';try{var x=localStorage.getItem('midimovie.lang');if(D[x])l=x}catch(e){}
  var d=D[l];document.documentElement.lang=l==='zh'?'zh-Hans':l;
  document.getElementById('h').textContent=d.h;document.getElementById('m').textContent=d.w;document.getElementById('lt').textContent=d.t;document.getElementById('ls').textContent=d.s;
  document.title='MidiMovie Pro';
  window.__thanks=d;
})();
</script>
<script>
(async()=>{
  const m=document.getElementById('m'),o=document.getElementById('o');
  const api=(window.MM_LICENSE&&MM_LICENSE.keyApi)||'';
  const sid=new URLSearchParams(location.search).get('session_id');
  try{
    if(!api||!sid) throw 0;
    const r=await fetch(api.replace(/\/$/,'')+'/key?session_id='+encodeURIComponent(sid)); const j=await r.json(); if(!j.ok) throw 0;
    m.textContent=window.__thanks.ok;try{var pk='midimovie.purchased.'+sid;if(window.mmTrack&&!localStorage.getItem(pk)){localStorage.setItem(pk,'1');mmTrack('purchase',{value:19,currency:'USD'});}}catch(_){}
    const a=document.createElement('a');a.className='b';a.href='editor.html#gift='+j.key;a.textContent=window.__thanks.btn;
    const c=document.createElement('code');c.textContent=j.key;const cb=document.createElement('button');cb.textContent=window.__thanks.copy;cb.style.cssText='background:#2a2a30;color:#eee;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin-top:8px';cb.onclick=async()=>{try{await navigator.clipboard.writeText(j.key);cb.textContent=window.__thanks.copied}catch(e){}};o.append(a,c,cb);
  }catch(e){ m.textContent=window.__thanks.ng; }
})();
</script></body></html>
