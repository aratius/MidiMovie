<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidiMovie</title>
<meta name="description" content="Play a MIDI keyboard along to a video in your browser, record layered takes, and export the audio as WAV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101216'/%3E%3Crect x='6' y='7' width='4' height='18' rx='1' fill='%23ff7a45'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%23ff7a45'/%3E%3Crect x='22' y='5' width='4' height='20' rx='1' fill='%23ff7a45'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="audioBanner" class="banner" hidden data-i18n="audio.enable"></div>

<header class="top">
  <div class="brand">
    <a href="./" class="logo-link" data-i18n-title="proj.back"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="7" width="4" height="18" rx="1"/><rect x="14" y="12" width="4" height="13" rx="1"/><rect x="22" y="5" width="4" height="20" rx="1"/></svg></a>
    <div class="proj-head">
      <a href="./" class="back" data-i18n="proj.back"></a>
      <div class="proj-line"><input type="text" id="projName" class="proj-name" maxlength="80" data-i18n-placeholder="proj.untitled" data-i18n-title="proj.name"><span class="save-state" id="saveState"></span></div>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn small ghost ibtn" id="btnProject" data-i18n-title="hdr.project"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg><span data-i18n="hdr.project"></span></button>
    <button class="btn small ghost ibtn" id="btnSettings" data-i18n-title="hdr.settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></button>
    <button class="btn small ghost ibtn" id="btnHelp" data-i18n-title="hdr.keys"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
    <button class="btn small primary ibtn" id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="exp.btn"></span></button>
    <div class="lang" id="langSwitch" role="group" data-i18n-title="lang.label"></div>
  </div>
</header>

<main class="layout">
  <div class="col-main">

    <!-- STAGE -->
    <section class="card stage">
      <div class="video-wrap" id="videoWrap">
        <video id="video" playsinline preload="auto"></video>
        <div class="drop" id="dropZone">
          <svg viewBox="0 0 24 24" class="drop-ico" aria-hidden="true"><path d="M4 5h11a2 2 0 0 1 2 2v2.5l4-2.5v10l-4-2.5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
          <div class="drop-title" data-i18n="stage.dropTitle"></div>
          <div class="drop-or" data-i18n="stage.or"></div>
          <button class="btn primary" id="loadVideoBtn" data-i18n="stage.loadVideo"></button>
        </div>
        <div class="count" id="countOverlay" hidden></div>
        <div class="rec-badge" id="recBadge" hidden><span class="rec-dot"></span><span data-i18n="rec.recording"></span></div>
        <button class="btn small ghost change-video" id="changeVideoBtn" hidden data-i18n="stage.changeVideo"></button>
      </div>
      <input type="file" id="videoFile" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv" hidden>

      <div class="timeline-wrap"><canvas id="timeline" height="60"></canvas></div>

      <div class="transport">
        <div class="tbtns">
          <button class="tbtn" id="btnStart" data-i18n-title="tr.toStart"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
          <button class="tbtn" id="btnPlay" data-i18n-title="tr.play"><svg viewBox="0 0 24 24" id="icoPlay"><path d="M7 4.5v15l13-7.5z"/></svg><svg viewBox="0 0 24 24" id="icoPause" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
          <button class="tbtn" id="btnStop" data-i18n-title="tr.stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
          <button class="tbtn rec" id="btnRec" data-i18n-title="tr.record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
        </div>
        <div class="time mono" id="timeDisplay">0:00.0 / 0:00.0</div>
        <div class="tbtns minor">
          <button class="tbtn small" id="btnFrameBack" data-i18n-title="tr.framePrev"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
          <button class="tbtn small" id="btnFrameFwd" data-i18n-title="tr.frameNext"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
          <button class="tbtn small" id="btnMarker" data-i18n-title="tr.marker"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h12l-3 4.5L18 13H6z"/></svg></button>
        </div>
        <div class="meter-wrap" data-i18n-title="meter.tip"><canvas id="meter" width="120" height="22"></canvas><span class="mono" id="meterText">−∞</span></div>
        <div class="vol">
          <button class="tbtn small" id="btnMute" data-i18n-title="stage.mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <input type="range" id="videoVol" min="0" max="1" step="0.01" value="0.6" data-i18n-title="stage.videoVolume">
        </div>
      </div>

      <div class="quickbar">
        <div class="field"><span class="flabel" data-i18n="rec.speed"></span>
          <div class="seg" id="speedSeg" role="group"><button type="button" data-rate="1">1×</button><button type="button" data-rate="0.75">¾</button><button type="button" data-rate="0.5">½</button><button type="button" data-rate="0.25">¼</button></div></div>
        <label class="field"><span class="flabel" data-i18n="rec.startFrom"></span>
          <select id="recFrom"><option value="start" data-i18n="rec.fromStart"></option><option value="here" data-i18n="rec.fromHere"></option></select></label>
        <label class="field"><span class="flabel" data-i18n="rec.countIn"></span>
          <select id="countIn"></select></label>
      </div>

      <div class="statusline">
        <span id="stageStatus" class="muted"></span>
        <span class="muted sync" id="syncInfo" hidden></span>
      </div>
    </section>

    <!-- NOTE EDITOR -->
    <section class="card roll" id="rollCard">
      <div class="card-head">
        <h2 data-i18n="roll.title"></h2>
        <span class="roll-target" id="rollTarget"></span>
        <div class="head-actions push">
          <button class="btn small" id="rollUndo" data-i18n="roll.undo"></button>
          <button class="btn small" id="rollRedo" data-i18n="roll.redo"></button>
        </div>
      </div>
      <div class="roll-tools">
        <label><span data-i18n="roll.snap"></span>
          <select id="rollSnap"><option value="0" data-i18n="roll.snapOff"></option><option value="0.01" selected>10 ms</option><option value="0.05">50 ms</option><option value="0.1">100 ms</option><option value="0.25">250 ms</option><option value="0.5">500 ms</option></select></label>
        <label class="zoom"><span data-i18n="roll.zoom"></span><input type="range" id="rollZoom" min="0" max="1000" value="400"></label>
        <label class="check"><input type="checkbox" id="rollFollow" checked><span data-i18n="roll.follow"></span></label>
        <label class="check"><input type="checkbox" id="rollVel" checked><span data-i18n="roll.velLane"></span></label>
        <button class="btn small" id="rollFit" data-i18n="roll.fit"></button>
      </div>
      <div class="roll-wrap" id="rollWrap"><canvas id="roll" tabindex="0"></canvas><div class="roll-empty" id="rollEmpty" data-i18n="roll.none"></div></div>
      <div class="vel-wrap" id="velWrap"><canvas id="velLane"></canvas></div>
      <div class="selbar" id="noteForm">
        <div class="sel-line">
          <span class="muted sel-info" id="noteSel"></span>
          <div class="sel-fields" id="selFields">
            <label><span data-i18n="roll.start"></span><input type="number" id="nStart" step="0.001" min="0"></label>
            <label><span data-i18n="roll.len"></span><input type="number" id="nLen" step="5" min="20"></label>
            <label><span data-i18n="roll.pitch"></span><input type="number" id="nPitch" step="1" min="0" max="127"></label>
            <label><span data-i18n="roll.vel"></span><input type="number" id="nVel" step="1" min="1" max="127"></label>
          </div>
        </div>
        <div class="sel-actions">
          <div class="grp-btns" role="group"><span class="flabel" data-i18n="roll.transposeSel"></span>
            <button class="btn small" data-st="-12">−12</button><button class="btn small" data-st="-1">−1</button><button class="btn small" data-st="1">+1</button><button class="btn small" data-st="12">+12</button></div>
          <div class="grp-btns" role="group">
            <button class="btn small" id="selCopy" data-i18n="roll.copy"></button><button class="btn small" id="selPaste" data-i18n="roll.paste"></button><button class="btn small" id="selDup" data-i18n="roll.dup"></button></div>
          <div class="grp-btns" role="group"><button class="btn small danger" id="rollDel" data-i18n="roll.delete"></button></div>
        </div>
      </div>
    </section>

    <!-- PENDING TAKE -->
    <section class="card take" id="takeCard" hidden>
      <div class="take-head">
        <span class="take-badge" data-i18n="take.title"></span>
        <span class="muted mono" id="takeInfo"></span>
      </div>
      <div class="btnrow">
        <button class="btn" id="takePreview" data-i18n="take.preview"></button>
        <button class="btn primary" id="takeKeep" data-i18n="take.keep"></button>
        <button class="btn" id="takeRerec" data-i18n="take.rerecord"></button>
        <button class="btn danger" id="takeDiscard" data-i18n="take.discard"></button>
      </div>
    </section>

    <!-- LAYERS -->
    <section class="card layers">
      <div class="card-head">
        <h2 data-i18n="layers.title"></h2>
        <div class="head-actions">
          <button class="btn small ghost" id="layersExport" data-i18n="exp.btn"></button>
        </div>
      </div>
      <div id="layerList" class="layer-list"></div>
    </section>

    <!-- KEYBOARD -->
    <section class="card kbcard">
      <div class="card-head">
        <h2 data-i18n="kb.title"></h2>
        <div class="oct-controls">
          <div class="stepper"><span data-i18n="midi.octave"></span>
            <button class="tbtn small" id="octDown">−</button><b class="mono" id="octVal">0</b><button class="tbtn small" id="octUp">+</button></div>
          <div class="stepper"><span data-i18n="midi.transpose"></span>
            <button class="tbtn small" id="trDown">−</button><b class="mono" id="trVal">0</b><button class="tbtn small" id="trUp">+</button></div>
        </div>
      </div>
      <div class="piano-wrap">
        <button class="tbtn small prange" id="pianoLeft" aria-label="‹">‹</button>
        <div class="piano" id="piano"></div>
        <button class="tbtn small prange" id="pianoRight" aria-label="›">›</button>
      </div>
      <div class="kb-hint" data-i18n="kb.hint"></div>
    </section>
  </div>

  <aside class="col-side">
    <!-- MIDI -->
    <section class="card midi">
      <div class="card-head">
        <h2 data-i18n="midi.title"></h2>
        <span class="pill" id="midiPill" data-i18n="midi.notConnected"></span>
      </div>
      <button class="btn primary wide" id="midiConnect" data-i18n="midi.connect"></button>
      <div class="note-msg" id="midiMsg" hidden></div>
      <div class="inputs" id="midiInputs"></div>
      <div class="grid2">
        <label><span data-i18n="midi.channel"></span><select id="midiChannel"></select></label>
        <label><span data-i18n="midi.velocity"></span>
          <select id="velMode"><option value="normal" data-i18n="midi.velNormal"></option><option value="fixed" data-i18n="midi.velFixed"></option></select></label>
      </div>
      <label class="check"><input type="checkbox" id="typing" checked><span data-i18n="midi.typing"></span></label>
      <div class="btnrow"><button class="btn small" id="panic" data-i18n="midi.panic"></button></div>

      <details class="mon-det" id="monDet" open>
        <summary><h3 data-i18n="midi.monitor"></h3><button class="btn small ghost" id="monClear" data-i18n="midi.clear"></button></summary>
        <div class="monitor mono" id="monitor"></div>
      </details>
    </section>

    <!-- INSTRUMENT -->
    <section class="card inst">
      <div class="card-head">
        <h2 data-i18n="inst.title"></h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tabBtnSimple" data-tab="simple" data-i18n="tab.simple"></button>
          <button class="tab" role="tab" id="tabBtnPro" data-tab="pro" data-i18n="tab.pro"></button>
          <button class="tab" role="tab" id="tabBtnSampler" data-tab="sampler" data-i18n="tab.sampler"></button>
        </div>
      </div>
      <div class="current-sound"><span class="muted" data-i18n="inst.current"></span> <b id="curSound"></b></div>

      <div id="tabSimple">
        <div class="chips" id="catChips"></div>
        <div class="preset-grid" id="presetGrid"></div>
        <div class="macros">
          <label><span data-i18n="macro.bright"></span><input type="range" id="mBright" min="0" max="1" step="0.01" value="0.5"></label>
          <label><span data-i18n="macro.length"></span><input type="range" id="mLength" min="0" max="1" step="0.01" value="0.5"></label>
          <label><span data-i18n="macro.space"></span><input type="range" id="mSpace" min="0" max="1" step="0.01" value="0.5"></label>
        </div>
        <div class="save-row">
          <input type="text" id="mineName" maxlength="40" data-i18n-placeholder="mine.name">
          <button class="btn small" id="mineSave" data-i18n="mine.save"></button>
        </div>
      </div>


      <div id="tabSampler" hidden>
        <div class="muted small-text" data-i18n="smp.hint"></div>
        <div class="btnrow tight">
          <button class="btn small" id="smpAdd" data-i18n="smp.add"></button>
          <button class="btn small" id="smpMic" data-i18n="smp.mic"></button>
          <button class="btn small" id="smpVideo" data-i18n="smp.video"></button>
          <input type="file" id="smpFile" accept="audio/*,.wav,.mp3,.ogg,.m4a,.aac,.flac" multiple hidden>
        </div>
        <div class="smp-list" id="smpList"></div>
        <div class="smp-detail" id="smpDetail" hidden>
          <div class="smp-title"><b id="smpName"></b><span class="muted mono" id="smpDur"></span>
            <button class="btn small ghost" id="smpRename" data-i18n="smp.rename"></button><button class="btn small ghost danger" id="smpDelete" data-i18n="smp.delete"></button></div>
          <div class="wave-wrap"><canvas id="smpWave" height="86"></canvas></div>
          <div class="smp-grid">
            <label><span data-i18n="smp.root"></span><select id="smpRoot"></select></label>
            <label class="check"><input type="checkbox" id="smpLoop"><span data-i18n="smp.loop"></span></label>
            <label><span data-i18n="p.attack"></span><input type="range" id="smpAtk" min="0.001" max="2" step="0.001"></label>
            <label><span data-i18n="p.release"></span><input type="range" id="smpRel" min="0.01" max="3" step="0.01"></label>
            <label><span data-i18n="smp.tone"></span><input type="range" id="smpTone" min="0" max="1000" step="1"></label>
            <label><span data-i18n="p.reverb"></span><input type="range" id="smpRev" min="0" max="1" step="0.01"></label>
            <label><span data-i18n="p.gain"></span><input type="range" id="smpGain" min="0.05" max="1" step="0.01"></label>
          </div>
          <button class="btn small" id="smpPlay" data-i18n="smp.play"></button>
        </div>
      </div>

      <div id="tabPro" hidden>
        <div class="muted small-text" data-i18n="inst.hint"></div>
        <div class="preset-row">
          <label><span data-i18n="inst.preset"></span><select id="presetSel"></select></label>
          <button class="btn small" id="randBtn" data-i18n="inst.random"></button>
        </div>
        <div id="instParams"></div>
      </div>
    </section>
  </aside>
</main>

<footer class="foot muted small-text">
  <span data-i18n="foot.privacy"></span> <span data-i18n="foot.browser"></span>
</footer>

<!-- DIALOGS -->
<dialog class="modal" id="dlgExport" aria-labelledby="dlgExportT">
  <div class="modal-in">
    <header class="modal-head"><h2 id="dlgExportT" data-i18n="exp.title"></h2><button class="x" data-close aria-label="Close">×</button></header>
    <div class="modal-body">
      <section class="msec">
        <h3 data-i18n="exp.audio"></h3>
        <p class="muted small-text" data-i18n="exp.mixNote"></p>
        <div class="mrow">
          <label class="field"><span class="flabel" data-i18n="exp.rate"></span><select id="expRate"><option value="44100">44.1 kHz</option><option value="48000" selected>48 kHz</option></select></label>
          <label class="field"><span class="flabel" data-i18n="exp.loud"></span>
            <select id="expLoud"><option value="off" data-i18n="exp.loudOff"></option><option value="peak" data-i18n="exp.loudPeak"></option><option value="lufs" data-i18n="exp.loudLufs"></option></select></label>
          <label class="field" id="expTargetWrap"><span class="flabel" data-i18n="exp.target"></span><span class="num"><input type="number" id="expTarget" value="-14" min="-40" max="-6" step="0.5"> <em>LUFS</em></span></label>
        </div>
        <div class="chips small" id="expChips" hidden>
          <button class="chip" data-lufs="-14" data-i18n="exp.p14"></button><button class="chip" data-lufs="-16" data-i18n="exp.p16"></button><button class="chip" data-lufs="-23" data-i18n="exp.p23"></button>
        </div>
        <div class="result" id="expResult" hidden></div>
        <div class="btnrow">
          <button class="btn primary" id="expMix" data-i18n="exp.mix"></button>
          <button class="btn" id="expStems" data-i18n="exp.stems"></button>
        </div>
      </section>
      <section class="msec">
        <h3 data-i18n="exp.midiTitle"></h3>
        <p class="muted small-text" data-i18n="exp.midiNote"></p>
        <div class="btnrow"><button class="btn" id="expMidi" data-i18n="exp.midi"></button></div>
      </section>
    </div>
  </div>
</dialog>

<dialog class="modal" id="dlgProject" aria-labelledby="dlgProjectT">
  <div class="modal-in">
    <header class="modal-head"><h2 id="dlgProjectT" data-i18n="hdr.project"></h2><button class="x" data-close aria-label="Close">×</button></header>
    <div class="modal-body">
      <section class="msec">
        <h3 data-i18n="prj.backup"></h3>
        <p class="muted small-text" data-i18n="prj.backupNote"></p>
        <div class="btnrow">
          <button class="btn primary" id="prjBackup" data-i18n="prj.backupBtn"></button>
          <button class="btn" id="prjRestore" data-i18n="prj.restoreBtn"></button>
          <input type="file" id="prjRestoreFile" accept=".zip,.json,application/zip,application/json" hidden>
        </div>
        <div class="result" id="prjMsg" hidden></div>
      </section>
      <section class="msec">
        <h3 data-i18n="prj.midiIn"></h3>
        <p class="muted small-text" data-i18n="prj.midiInNote"></p>
        <div class="btnrow"><button class="btn" id="prjMidi" data-i18n="prj.midiBtn"></button><input type="file" id="midiFile" accept=".mid,.midi,audio/midi" hidden></div>
      </section>
      <section class="msec">
        <h3 data-i18n="prj.file"></h3>
        <p class="muted small-text" data-i18n="prj.fileNote"></p>
        <div class="btnrow"><button class="btn" id="saveProj" data-i18n="proj.save"></button><button class="btn" id="openProj" data-i18n="proj.open"></button><input type="file" id="projFile" accept=".json,application/json" hidden></div>
      </section>
      <section class="msec"><a class="btn ghost" href="./" data-i18n="proj.back"></a></section>
    </div>
  </div>
</dialog>

<dialog class="modal" id="dlgSettings" aria-labelledby="dlgSettingsT">
  <div class="modal-in narrow">
    <header class="modal-head"><h2 id="dlgSettingsT" data-i18n="hdr.settings"></h2><button class="x" data-close aria-label="Close">×</button></header>
    <div class="modal-body">
      <section class="msec">
        <h3 data-i18n="set.recording"></h3>
        <label class="field"><span class="flabel" data-i18n="rec.latency"></span><span class="num"><input type="number" id="latency" value="0" min="-300" max="300" step="5"> <em>ms</em></span></label>
        <p class="muted small-text" data-i18n="set.latencyNote"></p>
        <label class="check"><input type="checkbox" id="monitorLayers" checked><span data-i18n="rec.monitor"></span></label>
      </section>
    </div>
  </div>
</dialog>

<dialog class="modal" id="dlgKeys" aria-labelledby="dlgKeysT">
  <div class="modal-in narrow">
    <header class="modal-head"><h2 id="dlgKeysT" data-i18n="hdr.keys"></h2><button class="x" data-close aria-label="Close">×</button></header>
    <div class="modal-body"><div class="keys-table" id="keysTable"></div></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="i18n.js"></script>
<script src="db.js"></script>
<script src="zip.js"></script>
<script src="midi-file.js"></script>
<script src="loudness.js"></script>
<script src="backup.js"></script>
