<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidiMovie</title>
<meta name="description" content="Play a MIDI keyboard along to a video in your browser, record layered takes, and export the audio as WAV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101216'/%3E%3Crect x='6' y='7' width='4' height='18' rx='1' fill='%23ff7a45'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%23ff7a45'/%3E%3Crect x='22' y='5' width='4' height='20' rx='1' fill='%23ff7a45'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="7" width="4" height="18" rx="1"/><rect x="14" y="12" width="4" height="13" rx="1"/><rect x="22" y="5" width="4" height="20" rx="1"/></svg>
    <div><h1>MidiMovie</h1><p data-i18n="app.subtitle"></p></div>
  </div>
  <div class="lang" id="langSwitch" role="group" data-i18n-title="lang.label"></div>
</header>

<main class="home-main">
  <section class="card manual-card">
    <div class="manual-text">
      <h2 data-i18n="home.manualTitle"></h2>
      <p class="muted" data-i18n="home.manualDesc"></p>
    </div>
    <div class="manual-links" id="manualLinks"></div>
  </section>

  <section class="home-head">
    <h2 data-i18n="home.projects"></h2>
    <div class="head-actions">
      <button class="btn small ghost" id="importBtn" data-i18n="home.import"></button>
      <input type="file" id="importFile" accept=".zip,.json,application/zip,application/json" hidden>
      <button class="btn primary" id="newBtn" data-i18n="home.new"></button>
    </div>
  </section>

  <div class="note-msg" id="homeMsg" hidden></div>
  <div class="proj-grid" id="projGrid"></div>

  <section class="muted small-text storage-info" id="storageInfo"></section>
</main>

<footer class="foot muted small-text">
  <span data-i18n="foot.privacy"></span> <span data-i18n="foot.browser"></span>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<footer class="legal-foot" style="text-align:center;padding:24px 16px;font-size:13px;opacity:.7"><a href="terms.html" data-i18n="legal.terms"></a> · <a href="privacy.html" data-i18n="legal.privacy"></a> · <a href="tokushoho.html" data-i18n="legal.tokushoho"></a></footer>
<script src="i18n.js"></script>
<script src="save.js"></script>
<script src="license-config.js"></script>
<script src="pro.js"></script>
<script src="db.js"></script>
<script src="zip.js"></script>
<script src="backup.js"></script>
<script src="projects.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
