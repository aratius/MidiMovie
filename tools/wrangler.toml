# Deploy with:  cd tools && wrangler deploy
name = "midimovie-license"
main = "stripe-license-worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOW_ORIGIN = "https://aratius.github.io"
SITE = "https://aratius.github.io/MidiMovie/"
DEVICE_LIMIT = "3"

# Create once:  wrangler kv namespace create LICENSES   -> paste the printed id below
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_KV_ID"
